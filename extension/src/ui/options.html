    <section id="welcome" class="card sec welcome" hidden>
      <h2>欢迎使用 WatchVid4U</h2>
      <ol>
        <li><b>B站有字幕的视频</b>：无需任何配置，打开视频页点“开始录制”即可直接得到逐字稿。</li>
        <li><b>需要录音转写</b>（无字幕的 B站、YouTube、抖音、普通网页）：在下方“语音转写”填写一个 OpenAI 兼容的转写服务并授权，或使用可选的本地服务。</li>
        <li><b>想要学习笔记</b>：在“笔记模型”配置一个 Chat Completions 服务。</li>
      </ol>
      <p class="hint">日常使用只需一次点击：插件自动选择字幕或录音，播完自动暂停网页并转写。</p>
    </section>
